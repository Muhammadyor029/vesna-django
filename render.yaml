services:
  - type: web
    name: vesna-org
    runtime: python
    plan: free
    buildCommand: pip install -r requirements/prod.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py ensure_admin
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: vesna-org.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://vesna-org.onrender.com
      - key: DJANGO_ADMIN_USER
        value: admin
      - key: DJANGO_ADMIN_PASSWORD
        generateValue: true
      - key: DJANGO_ADMIN_EMAIL
        value: admin@vesna.uz
